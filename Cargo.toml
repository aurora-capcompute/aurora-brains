[workspace]
resolver = "2"
members = ["sdk", "programs/agent"]

# The agent is a crate under programs/agent/, compiled to wasm32-wasip1 as a
# cdylib over the sdk.

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
aurora-program-sdk = { path = "sdk" }
anyhow = "1"
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
